<div class="page pageTest full-width content-grid hidden" data-nosnippet>
  <mount data-component="testconfig" class="full-width"></mount>

  <div id="testInitFailed" class="content-grid hidden">
    <div class="message">
      <div class="text">
        Test initialization failed. Please try different settings or refreshing
        the page. If the problem persists, please contact support.
      </div>
      <div class="error"></div>
      <button class="active restart">
        <i class="fas fa-fw fa-redo-alt"></i>
        Restart
      </button>
    </div>
  </div>
  <div id="typingTest" class="content-grid full-width-padding">
    <mount data-component="capswarning"></mount>
    <div id="memoryTimer">Time left to memorise all words: 0s</div>
    <div id="layoutfluidTimer">Time left to memorise all words: 0s</div>
    <mount data-component="testmodesnotice"></mount>

    <div
      id="enVnTranslationTopDisplay"
      class="hidden"
      aria-hidden="true"
    >
      <div class="translationVietnamese"></div>
      <div class="translationEnglish"></div>
      <div class="translationIpa"></div>
      <div class="translationHint"></div>
      <div class="translationActions hidden">
        <button type="button" data-learning-action="replay">
          <i class="fas fa-volume-up" aria-hidden="true"></i>
          replay
        </button>
        <button type="button" data-learning-action="reveal">
          <i class="fas fa-lightbulb" aria-hidden="true"></i>
          reveal letter
        </button>
      </div>
    </div>

    <section
      id="sentenceBuilderPanel"
      class="hidden"
      aria-label="Sentence Builder"
    >
      <div class="sentenceBuilderHeader">
        <div>
          <div class="sentenceBuilderEyebrow">sentence builder</div>
          <div id="sentenceBuilderPrompt" class="sentenceBuilderPrompt"></div>
          <div id="sentenceBuilderMeaning" class="sentenceBuilderMeaning"></div>
        </div>
        <div id="sentenceBuilderFixedStart" class="sentenceBuilderFixedStart"></div>
      </div>

      <div id="sentenceBuilderUnits" class="sentenceBuilderUnits"></div>

      <input
        id="sentenceBuilderAnswer"
        type="text"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Build or type your answer"
      />

      <div id="sentenceBuilderHint" class="sentenceBuilderHint"></div>
      <div id="sentenceBuilderFeedback" class="sentenceBuilderFeedback"></div>

      <div class="sentenceBuilderActions">
        <button id="sentenceBuilderReveal" type="button">
          reveal next word
        </button>
        <button id="sentenceBuilderGrammarHint" type="button">
          grammar hint
        </button>
        <button id="sentenceBuilderStructureHint" type="button">
          structure hint
        </button>
        <button id="sentenceBuilderReset" type="button">
          reset
        </button>
        <button id="sentenceBuilderSubmit" type="button" class="primary">
          check answer
        </button>
      </div>
    </section>

    <section
      id="contextClozePanel"
      class="hidden"
      aria-label="Context Cloze"
    >
      <div class="contextClozeHeader">
        <div>
          <div class="contextClozeEyebrow">context / cloze</div>
          <div id="contextClozeType" class="contextClozeType"></div>
          <div id="contextClozeTopic" class="contextClozeTopic"></div>
        </div>
        <div id="contextClozeProgress" class="contextClozeProgress"></div>
      </div>

      <div id="contextClozePrompt" class="contextClozePrompt"></div>

      <input
        id="contextClozeAnswer"
        type="text"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Type the missing word or phrase"
      />

      <div id="contextClozeHint" class="contextClozeHint"></div>
      <div id="contextClozeFeedback" class="contextClozeFeedback"></div>

      <div class="contextClozeActions">
        <button id="contextClozeReveal" type="button">
          reveal letter
        </button>
        <button id="contextClozeSubmit" type="button" class="primary">
          check answer
        </button>
        <button id="contextClozeNext" type="button" disabled>
          next
        </button>
      </div>
    </section>

    <mount data-component="livestatstexttop"></mount>
    <mount data-component="livestatsmini" class="full-width"></mount>
    <div id="wordsWrapper" class="content-grid full-width" translate="no">
      <textarea
        id="wordsInput"
        class="full-width"
        autocomplete="off"
        autocapitalize="off"
        autocapitalize="none"
        autocorrect="off"
        data-gramm="false"
        data-gramm_editor="false"
        data-enable-grammarly="false"
        data-bwignore
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        list="autocompleteOff"
        spellcheck="false"
      ></textarea>
      <mount data-component="outoffocuswarning" class="contents"></mount>
      <div id="paceCaret" class="full-width default hidden"></div>
      <div id="caret" class="full-width default"></div>
      <div id="words" class="full-width"></div>
    </div>

    <mount data-component="compositiondisplay"></mount>
    <mount data-component="keymap"></mount>
    <mount data-component="monkey"></mount>

    <button
      id="restartTestButton"
      aria-label="Restart Test"
      data-balloon-pos="down"
      class="text"
    >
      <i class="fas fa-fw fa-redo-alt"></i>
    </button>
    <mount data-component="livestatstextbottom"></mount>
    <mount data-component="premid"></mount>
  </div>
  <div class="loading hidden">
    <i class="fas fa-circle-notch fa-spin"></i>
  </div>
  <load src="./test-result.html" />
</div>
